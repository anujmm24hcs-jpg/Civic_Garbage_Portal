<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CivicClean</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>

        /* =========================================
           REGISTER PAGE
        ========================================= */

        .register-section {

            min-height: calc(100vh - 70px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 50px 20px;

            background:
                linear-gradient(
                    135deg,
                    #ecfdf5,
                    #eff6ff
                );

        }


        .register-container {

            width: 100%;

            max-width: 460px;

        }


        /* =========================================
           REGISTER CARD
        ========================================= */

        .register-box {

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.10);

            border: 1px solid #e5e7eb;

        }


        .register-logo {

            text-align: center;

            font-size: 50px;

            margin-bottom: 10px;

        }


        .register-box h1 {

            text-align: center;

            margin: 0 0 8px;

            color: #166534;

            font-size: 30px;

        }


        .register-subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;

            line-height: 1.5;

        }


        /* =========================================
           FORM
        ========================================= */

        .register-form label {

            display: block;

            font-weight: 600;

            color: #374151;

            margin-bottom: 8px;

        }


        .register-form input {

            width: 100%;

            box-sizing: border-box;

            padding: 13px 14px;

            margin-bottom: 20px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: 0.2s ease;

        }


        .register-form input:focus {

            border-color: #166534;

            box-shadow:
                0 0 0 3px rgba(22, 101, 52, 0.10);

        }


        /* =========================================
           PASSWORD FIELD
        ========================================= */

        .password-wrapper {

            position: relative;

        }


        .password-wrapper input {

            padding-right: 50px;

        }


        .toggle-password {

            position: absolute;

            right: 12px;

            top: 10px;

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 18px;

            color: #6b7280;

        }


        .toggle-password:hover {

            color: #166534;

        }


        /* =========================================
           REGISTER BUTTON
        ========================================= */

        .register-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #166534;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .register-button:hover {

            background: #14532d;

            transform: translateY(-1px);

        }


        /* =========================================
           LOGIN LINK
        ========================================= */

        .login-link {

            text-align: center;

            margin-top: 25px;

            color: #6b7280;

            font-size: 14px;

        }


        .login-link a {

            color: #166534;

            font-weight: 700;

            text-decoration: none;

        }


        .login-link a:hover {

            text-decoration: underline;

        }


        /* =========================================
           HOME LINK
        ========================================= */

        .home-link {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #2563eb;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

        }


        .home-link:hover {

            text-decoration: underline;

        }


        /* =========================================
           PASSWORD HINT
        ========================================= */

        .password-hint {

            margin-top: -12px;

            margin-bottom: 20px;

            font-size: 12px;

            color: #6b7280;

        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 500px) {

            .register-section {

                padding: 30px 15px;

            }


            .register-box {

                padding: 28px 22px;

            }


            .register-box h1 {

                font-size: 26px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar">

        <div class="logo">

            CivicClean

        </div>


        <div class="nav-links">

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </nav>



    <!-- =========================================
         REGISTER SECTION
    ========================================= -->

    <section class="register-section">


        <div class="register-container">


            <div class="register-box">


                <!-- LOGO -->

                <div class="register-logo">
                    ♻️
                </div>


                <h1>
                    Create Account
                </h1>


                <p class="register-subtitle">

                    Join CivicClean and help make
                    your community cleaner.

                </p>



                <!-- REGISTER FORM -->

                <form
                    method="POST"
                    action="{{ url_for('register') }}"
                    class="register-form"
                >


                    <!-- NAME -->

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                        autocomplete="name"
                    >



                    <!-- EMAIL -->

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >



                    <!-- PASSWORD -->

                    <label for="password">
                        Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                            minlength="6"
                            autocomplete="new-password"
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword('password', this)"
                            aria-label="Show or hide password"
                        >
                            👁️
                        </button>

                    </div>


                    <p class="password-hint">

                        Password must contain at least 6 characters.

                    </p>



                    <!-- CONFIRM PASSWORD -->

                    <label for="confirm_password">
                        Confirm Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Confirm your password"
                            required
                            minlength="6"
                            autocomplete="new-password"
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword('confirm_password', this)"
                            aria-label="Show or hide password"
                        >
                            👁️
                        </button>

                    </div>



                    <!-- REGISTER BUTTON -->

                    <button
                        type="submit"
                        class="register-button"
                    >

                        🚀 Create Account

                    </button>


                </form>



                <!-- LOGIN LINK -->

                <div class="login-link">

                    Already have an account?

                    <a href="{{ url_for('login') }}">
                        Login Here
                    </a>

                </div>



                <!-- HOME -->

                <a
                    href="{{ url_for('home') }}"
                    class="home-link"
                >

                    ← Back to CivicClean Home

                </a>


            </div>


        </div>

    </section>



    <!-- =========================================
         PASSWORD SCRIPT
    ========================================= -->

    <script>

        function togglePassword(inputId, button) {

            const password =
                document.getElementById(inputId);


            if (password.type === "password") {

                password.type = "text";

                button.textContent = "🙈";

            }

            else {

                password.type = "password";

                button.textContent = "👁️";

            }

        }



        /* =========================================
           CONFIRM PASSWORD VALIDATION
        ========================================= */

        document
            .querySelector(".register-form")
            .addEventListener("submit", function(event) {

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirm_password").value;


                if (password !== confirmPassword) {

                    event.preventDefault();

                    alert("Passwords do not match!");

                }

            });

    </script>


</body>

</html>
